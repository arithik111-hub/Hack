<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1152" role="img" aria-labelledby="title description">
  <title id="title">Eclipse Zero</title>
  <desc id="description">Original violet eclipse above a futuristic city at night.</desc>
  <defs>
